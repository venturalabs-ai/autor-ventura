name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate provenance
        run: |
          test -f PROVENANCE.md
          grep -q 'agency-agents' PROVENANCE.md
      - name: Validate Agent Skill contracts
        run: python scripts/validate_skills.py
      - name: Run structural and editorial evals
        run: |
          python scripts/run_evals.py
          python evals/eval_structural.py
          python -m unittest discover -s editorial-evals -p 'test_*.py' -v
