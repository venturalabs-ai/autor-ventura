name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SemVer tag and VERSION
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $TAG" >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          test "$TAG" = "v$VERSION" || { echo "Tag $TAG does not match VERSION $VERSION" >&2; exit 1; }
      - name: Run eval gates
        run: |
          python scripts/run_evals.py
          python evals/eval_structural.py
      - name: Validate provenance
        run: |
          test -f PROVENANCE.md
          grep -q 'agency-agents' PROVENANCE.md
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Build reproducible source artifact
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=autor-ventura-${GITHUB_REF_NAME}/ -o autor-ventura-${GITHUB_REF_NAME}.tar.gz HEAD
          sha256sum autor-ventura-${GITHUB_REF_NAME}.tar.gz sbom.spdx.json > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            autor-ventura-${{ github.ref_name }}.tar.gz
            sbom.spdx.json
            SHA256SUMS
